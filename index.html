<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake Game</title>
    <link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#22c55e">
    
<!-- ICONO DE LA PESTAÑA -->
<link rel="icon" type="image/png" href="./427533.png">

<!-- PWA -->
<link rel="manifest" href="./manifest.json">

<!-- COLOR DE LA APLICACIÓN -->
<meta name="theme-color" content="#22c55e">
<link
    rel="icon"
    type="image/png"
    href="./427533.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #080b12;
            --panel: #111827;
            --border: #263244;
            --text: #f8fafc;
            --muted: #94a3b8;
            --green: #22c55e;
            --green-dark: #15803d;
            --red: #ef4444;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #172033,
                    var(--bg) 60%
                );

            color: var(--text);
            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 620px;
        }

        /* =========================
           HEADER
        ========================== */

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 45px;
            letter-spacing: 4px;
        }

        .header h1 span {
            color: var(--green);
        }

        .header p {
            color: var(--muted);
            margin-top: 5px;
        }

        /* =========================
           SCORE
        ========================== */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px;
            text-align: center;
        }

        .stat small {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 5px;
        }

        .stat strong {
            font-size: 22px;
        }

        /* =========================
           GAME
        ========================== */

        .game-wrapper {
            position: relative;
            background: var(--panel);
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;

            background:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 20px 20px;

            border-radius: 10px;
        }

        /* =========================
           GAME OVER
        ========================== */

        .game-over {
            position: absolute;

            inset: 12px;

            background: rgba(8, 11, 18, 0.88);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            border-radius: 10px;

            opacity: 0;
            pointer-events: none;

            transition: 0.3s;
        }

        .game-over.show {
            opacity: 1;
            pointer-events: auto;
        }

        .game-over h2 {
            font-size: 35px;
            margin-bottom: 8px;
        }

        .game-over p {
            color: var(--muted);
            margin-bottom: 20px;
        }

        button {
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .restart {
            background: var(--green);
            color: #052e16;

            padding: 12px 22px;

            border-radius: 10px;

            transition: 0.2s;
        }

        .restart:hover {
            background: #4ade80;
            transform: scale(1.05);
        }

        /* =========================
           CONTROLS
        ========================== */

        .controls {
            margin-top: 18px;

            display: grid;
            grid-template-columns: repeat(3, 65px);
            justify-content: center;

            gap: 8px;
        }

        .control {
            width: 65px;
            height: 55px;

            background: var(--panel);
            color: white;

            border: 1px solid var(--border);
            border-radius: 10px;

            font-size: 22px;

            transition: 0.1s;
        }

        .control:hover {
            background: #1e293b;
        }

        .control:active {
            transform: scale(0.9);
            background: var(--green-dark);
        }

        .up {
            grid-column: 2;
        }

        .left {
            grid-column: 1;
            grid-row: 2;
        }

        .down {
            grid-column: 2;
            grid-row: 2;
        }

        .right {
            grid-column: 3;
            grid-row: 2;
        }

        /* =========================
           INFO
        ========================== */

        .info {
            margin-top: 20px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .info span {
            color: var(--green);
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 500px) {

            .header h1 {
                font-size: 35px;
            }

            .controls {
                grid-template-columns: repeat(3, 58px);
            }

            .control {
                width: 58px;
                height: 52px;
            }
        }
    </style>
</head>

<body>

    <div class="game-container">

        <!-- =====================
             TITULO
        ====================== -->

        <div class="header">

            <h1>
                SNAKE<span>!</span>
            </h1>

            <p>
                Come, crece y consigue el mayor récord.
            </p>

        </div>


        <!-- =====================
             ESTADISTICAS
        ====================== -->

        <div class="stats">

            <div class="stat">
                <small>PUNTUACIÓN</small>
                <strong id="score">0</strong>
            </div>

            <div class="stat">
                <small>RÉCORD</small>
                <strong id="highScore">0</strong>
            </div>

            <div class="stat">
                <small>NIVEL</small>
                <strong id="level">1</strong>
            </div>

        </div>


        <!-- =====================
             JUEGO
        ====================== -->

        <div class="game-wrapper">

            <canvas
                id="gameCanvas"
                width="600"
                height="600">
            </canvas>


            <!-- GAME OVER -->

            <div
                class="game-over"
                id="gameOver">

                <h2>GAME OVER</h2>

                <p>
                    Puntuación:
                    <strong id="finalScore">0</strong>
                </p>

                <button
                    class="restart"
                    id="restartBtn">

                    Jugar nuevamente

                </button>

            </div>

        </div>


        <!-- =====================
             CONTROLES
        ====================== -->

        <div class="controls">

            <button
                class="control up"
                data-direction="up">
                ▲
            </button>

            <button
                class="control left"
                data-direction="left">
                ◀
            </button>

            <button
                class="control down"
                data-direction="down">
                ▼
            </button>

            <button
                class="control right"
                data-direction="right">
                ▶
            </button>

        </div>


        <!-- =====================
             INFORMACION
        ====================== -->

        <div class="info">

            Usa las <span>flechas del teclado</span>
            o los botones para moverte.

        </div>

    </div>


    <script>

        // =========================================
        // CANVAS
        // =========================================

        const canvas =
            document.getElementById("gameCanvas");

        const ctx =
            canvas.getContext("2d");


        // =========================================
        // CONFIGURACIÓN
        // =========================================

        const gridSize = 20;

        const tileCount =
            canvas.width / gridSize;


        // =========================================
        // ELEMENTOS HTML
        // =========================================

        const scoreElement =
            document.getElementById("score");

        const highScoreElement =
            document.getElementById("highScore");

        const levelElement =
            document.getElementById("level");

        const gameOverScreen =
            document.getElementById("gameOver");

        const finalScore =
            document.getElementById("finalScore");

        const restartBtn =
            document.getElementById("restartBtn");


        // =========================================
        // VARIABLES DEL JUEGO
        // =========================================

        let snake;

        let food;

        let direction;

        let nextDirection;

        let score;

        let highScore =
            Number(localStorage.getItem("snakeHighScore")) || 0;

        let level;

        let gameLoop;

        let gameRunning;


        // =========================================
        // INICIAR JUEGO
        // =========================================

        function startGame() {

            snake = [

                {
                    x: 15,
                    y: 15
                },

                {
                    x: 14,
                    y: 15
                },

                {
                    x: 13,
                    y: 15
                }

            ];


            direction = {
                x: 1,
                y: 0
            };


            nextDirection = {
                x: 1,
                y: 0
            };


            score = 0;

            level = 1;

            gameRunning = true;


            gameOverScreen.classList.remove("show");


            updateStats();

            generateFood();

            startLoop();

        }


        // =========================================
        // VELOCIDAD
        // =========================================

        function getSpeed() {

            /*
                Cada nivel aumenta la velocidad.
                El límite evita que sea demasiado rápido.
            */

            return Math.max(
                70,
                150 - ((level - 1) * 10)
            );

        }


        // =========================================
        // LOOP
        // =========================================

        function startLoop() {

            clearInterval(gameLoop);

            gameLoop = setInterval(
                update,
                getSpeed()
            );

        }


        // =========================================
        // ACTUALIZAR JUEGO
        // =========================================

        function update() {

            if (!gameRunning) return;


            direction = nextDirection;


            const head = {

                x: snake[0].x + direction.x,

                y: snake[0].y + direction.y

            };


            // =====================================
            // COLISIÓN CON PAREDES
            // =====================================

            if (

                head.x < 0 ||

                head.x >= tileCount ||

                head.y < 0 ||

                head.y >= tileCount

            ) {

                endGame();

                return;

            }


            // =====================================
            // COLISIÓN CON EL CUERPO
            // =====================================

            for (
                let i = 0;
                i < snake.length;
                i++
            ) {

                if (

                    head.x === snake[i].x &&

                    head.y === snake[i].y

                ) {

                    endGame();

                    return;

                }

            }


            snake.unshift(head);


            // =====================================
            // COMER COMIDA
            // =====================================

            if (

                head.x === food.x &&

                head.y === food.y

            ) {

                score += 10;


                // Cada 50 puntos sube de nivel

                const newLevel =
                    Math.floor(score / 50) + 1;


                if (newLevel !== level) {

                    level = newLevel;

                    startLoop();

                }


                generateFood();

            }

            else {

                snake.pop();

            }


            draw();

            updateStats();

        }


        // =========================================
        // GENERAR COMIDA
        // =========================================

        function generateFood() {

            let validPosition = false;


            while (!validPosition) {

                food = {

                    x: Math.floor(
                        Math.random() * tileCount
                    ),

                    y: Math.floor(
                        Math.random() * tileCount
                    )

                };


                validPosition = !snake.some(
                    segment =>
                        segment.x === food.x &&
                        segment.y === food.y
                );

            }

        }


        // =========================================
        // DIBUJAR
        // =========================================

        function draw() {

            // Fondo

            ctx.fillStyle = "#080b12";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // =====================================
            // COMIDA
            // =====================================

            ctx.fillStyle = "#ef4444";

            ctx.beginPath();

            ctx.arc(

                food.x * gridSize + gridSize / 2,

                food.y * gridSize + gridSize / 2,

                gridSize / 2 - 2,

                0,

                Math.PI * 2

            );

            ctx.fill();


            // =====================================
            // SERPIENTE
            // =====================================

            snake.forEach((segment, index) => {

                if (index === 0) {

                    ctx.fillStyle = "#4ade80";

                }

                else {

                    ctx.fillStyle = "#22c55e";

                }


                ctx.fillRect(

                    segment.x * gridSize + 2,

                    segment.y * gridSize + 2,

                    gridSize - 4,

                    gridSize - 4

                );

            });


            // =====================================
            // OJOS
            // =====================================

            drawEyes();

        }


        // =========================================
        // OJOS DE LA SERPIENTE
        // =========================================

        function drawEyes() {

            const head = snake[0];


            ctx.fillStyle = "#052e16";


            let eye1;
            let eye2;


            if (direction.x === 1) {

                eye1 = {
                    x: head.x * gridSize + 14,
                    y: head.y * gridSize + 6
                };

                eye2 = {
                    x: head.x * gridSize + 14,
                    y: head.y * gridSize + 14
                };

            }

            else if (direction.x === -1) {

                eye1 = {
                    x: head.x * gridSize + 6,
                    y: head.y * gridSize + 6
                };

                eye2 = {
                    x: head.x * gridSize + 6,
                    y: head.y * gridSize + 14
                };

            }

            else if (direction.y === -1) {

                eye1 = {
                    x: head.x * gridSize + 6,
                    y: head.y * gridSize + 6
                };

                eye2 = {
                    x: head.x * gridSize + 14,
                    y: head.y * gridSize + 6
                };

            }

            else {

                eye1 = {
                    x: head.x * gridSize + 6,
                    y: head.y * gridSize + 14
                };

                eye2 = {
                    x: head.x * gridSize + 14,
                    y: head.y * gridSize + 14
                };

            }


            ctx.fillRect(
                eye1.x,
                eye1.y,
                3,
                3
            );


            ctx.fillRect(
                eye2.x,
                eye2.y,
                3,
                3
            );

        }


        // =========================================
        // CAMBIAR DIRECCIÓN
        // =========================================

        function changeDirection(newDirection) {

            if (!gameRunning) return;


            /*
                Evitamos que la serpiente
                pueda girar directamente
                sobre sí misma.
            */

            if (
                newDirection === "up" &&
                direction.y !== 1
            ) {

                nextDirection = {
                    x: 0,
                    y: -1
                };

            }


            if (
                newDirection === "down" &&
                direction.y !== -1
            ) {

                nextDirection = {
                    x: 0,
                    y: 1
                };

            }


            if (
                newDirection === "left" &&
                direction.x !== 1
            ) {

                nextDirection = {
                    x: -1,
                    y: 0
                };

            }


            if (
                newDirection === "right" &&
                direction.x !== -1
            ) {

                nextDirection = {
                    x: 1,
                    y: 0
                };

            }

        }


        // =========================================
        // TECLADO
        // =========================================

        document.addEventListener(
            "keydown",
            event => {

                const keys = {

                    ArrowUp: "up",

                    ArrowDown: "down",

                    ArrowLeft: "left",

                    ArrowRight: "right",

                    w: "up",

                    W: "up",

                    s: "down",

                    S: "down",

                    a: "left",

                    A: "left",

                    d: "right",

                    D: "right"

                };


                if (keys[event.key]) {

                    event.preventDefault();

                    changeDirection(
                        keys[event.key]
                    );

                }

            }
        );


        // =========================================
        // BOTONES TÁCTILES
        // =========================================

        document
            .querySelectorAll(".control")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        changeDirection(
                            button.dataset.direction
                        );

                    }
                );

            });


        // =========================================
        // GAME OVER
        // =========================================

        function endGame() {

            gameRunning = false;

            clearInterval(gameLoop);


            if (score > highScore) {

                highScore = score;

                localStorage.setItem(
                    "snakeHighScore",
                    highScore
                );

            }


            finalScore.textContent = score;

            updateStats();

            gameOverScreen.classList.add("show");

        }


        // =========================================
        // ESTADÍSTICAS
        // =========================================

        function updateStats() {

            scoreElement.textContent = score;

            highScoreElement.textContent = highScore;

            levelElement.textContent = level;

        }


        // =========================================
        // REINICIAR
        // =========================================

        restartBtn.addEventListener(
            "click",
            startGame
        );


        // =========================================
        // INICIAR
        // =========================================

        startGame();
// =========================================
// REGISTRAR SERVICE WORKER
// =========================================

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./service-worker.js")
            .then(registration => {

                console.log(
                    "Service Worker registrado correctamente:",
                    registration.scope
                );

            })
            .catch(error => {

                console.error(
                    "Error registrando Service Worker:",
                    error
                );

            });

    });

}
    </script>

</body>
</html>
